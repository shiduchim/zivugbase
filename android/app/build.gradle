plugins {
    id 'com.android.application'
}

android {
    namespace 'org.zivugbase.addon'
    compileSdk 35

    defaultConfig {
        applicationId 'org.zivugbase.addon'
        minSdk 24
        targetSdk 35
        /* Minutes since 1970: every build is newer than the last, so it installs as an update. */
        versionCode ((int) (System.currentTimeMillis() / 60000L))
        versionName '0.1'
    }

    /* full = the bubble (needs Accessibility; Play Protect may block installing it).
       lite = only "ZivugBase" in the text-selection menu (no special permission). */
    flavorDimensions 'kind'
    productFlavors {
        full { dimension 'kind' }
        lite { dimension 'kind' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
