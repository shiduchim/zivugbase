<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315b78">
<meta name="description" content="ZivugBase - a CRM-structured shidduch relationship tracker that keeps all data on your own device.">
<title>ZivugBase</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="brand">ZivugBase</div>
      <div class="brand-sub">Private shidduch tracker</div>
    </div>
    <button id="global-search" class="btn btn-soft btn-sm" aria-label="Search everything">Search</button>
  </header>

  <main id="screen" aria-live="polite"></main>

  <nav aria-label="Sections">
    <button data-screen="today">Today</button>
    <button data-screen="guys">Guys</button>
    <button data-screen="girls">Girls</button>
    <button data-screen="shadchanim">Shadchanim</button>
    <button data-screen="data">Data</button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
