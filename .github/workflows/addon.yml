name: Build Android add-on

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/addon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: android/sdk-setup.sh
      - run: android/build-apk.sh addon-out
      - uses: actions/upload-artifact@v4
        with:
          name: ZivugBase-addon
          path: addon-out/
          if-no-files-found: error
